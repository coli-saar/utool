name: Release Utool

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      windows_bundles: ${{ steps.version.outputs.windows_bundles }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag and manifest versions
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./utool-rust/desktop/src-tauri/tauri.conf.json').version")
          npm_version=$(node -p "require('./utool-rust/desktop/package.json').version")
          rust_version=$(sed -n 's/^version = "\(.*\)"/\1/p' utool-rust/Cargo.toml | head -1)
          desktop_rust_version=$(sed -n 's/^version = "\(.*\)"/\1/p' utool-rust/desktop/src-tauri/Cargo.toml | head -1)

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          if [[ "$npm_version" != "$version" || "$rust_version" != "$version" || "$desktop_rust_version" != "$version" ]]; then
            echo "Cargo, npm, and Tauri versions must all match ($version)" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "windows_bundles=nsis" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "windows_bundles=nsis,msi" >> "$GITHUB_OUTPUT"
          fi

  publish-desktop:
    name: Desktop (${{ matrix.target }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: utool-rust/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            utool-rust
            utool-rust/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: utool-rust/desktop
        run: npm ci

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: utool-rust/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Utool ${{ needs.prepare.outputs.version }}
          releaseBody: |
            These builds are not developer-signed or notarized. Windows and macOS may require manual approval before first launch.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: --target ${{ matrix.target }} --bundles ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_bundles || matrix.bundles }}

      - name: Build command-line program
        run: cargo build --locked --release --manifest-path utool-rust/Cargo.toml --target ${{ matrix.target }}

      - name: Archive command-line and display programs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="release-package-${{ matrix.target }}"
          mkdir "$package_dir"
          cp "utool-rust/target/${{ matrix.target }}/release/utool" "$package_dir/utool"
          cp "utool-rust/desktop/src-tauri/target/${{ matrix.target }}/release/utool-display" "$package_dir/utool-display"
          archive="utool-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C "$package_dir" -czf "$archive" utool utool-display

      - name: Archive command-line and display programs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "release-package-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $packageDir
          Copy-Item "utool-rust/target/${{ matrix.target }}/release/utool.exe" "$packageDir/utool.exe"
          Copy-Item "utool-rust/desktop/src-tauri/target/${{ matrix.target }}/release/utool-display.exe" "$packageDir/utool-display.exe"
          $archive = "utool-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "$packageDir/utool.exe", "$packageDir/utool-display.exe" -DestinationPath $archive

      - name: Save combined archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: utool-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  upload-cli:
    name: Add CLI archives to release
    needs:
      - prepare
      - publish-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Upload CLI archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
