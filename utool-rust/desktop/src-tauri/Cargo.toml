[package]
name = "utool-display"
version = "4.0.0-alpha4"
description = "Desktop interface for Utool"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"

[lib]
name = "utool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
quick-xml = "0.41"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
utool = { path = "../.." }

# Keep Tauri's fast, debuggable development build while compiling the
# CPU-intensive Utool engine and its dependencies with full optimization.
[profile.dev.package."*"]
opt-level = 3
