[package]
name = "utool-desktop"
version = "0.1.0"
description = "Desktop interface for Utool"
edition = "2024"
rust-version = "1.86"

[lib]
name = "utool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
utool = { path = "../.." }
